name: "DeskLink - Windows & macOS Build"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Sürüm adı (örn: v1.0.1)'
        required: false
        default: 'v1.0.0'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3)
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
          # macOS Intel
          - platform: macos-13
            target: x86_64-apple-darwin
            label: macOS-Intel
          # Windows 64-bit
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 📥 Kodu İndir
        uses: actions/checkout@v4

      - name: 🟢 Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🦀 Rust Kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 🗄️ Rust Cache (Derleme Hızlandırma)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 📦 Node Bağımlılıkları Yükle
        run: npm ci

      - name: 🔨 Frontend Build (Vite)
        run: npm run build

      - name: 🚀 Tauri Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DeskLink ${{ github.ref_name }}"
          releaseBody: |
            ## DeskLink - Uzaktan Masaüstü Kontrolü

            ### Kurulum Dosyaları
            | Platform | Dosya |
            |----------|-------|
            | 🪟 Windows (64-bit) | `desklink_x.x.x_x64_en-US.msi` |
            | 🍎 macOS Apple Silicon | `desklink_x.x.x_aarch64.dmg` |
            | 🍎 macOS Intel | `desklink_x.x.x_x64.dmg` |

            ### Kullanım
            1. Signaling sunucusunu deploy edin: `cd server && railway up`
            2. Her iki bilgisayara uygulamayı kurun
            3. Ayarlar → Sinyal Sunucusu → Railway URL'inizi girin
            4. ID'nizi karşı tarafa iletin ve bağlanın!
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: 📤 Artifact Upload (her platform için)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskLink-${{ matrix.label }}
          retention-days: 30
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz

  # Signaling Sunucusunu Railway'e Deploy Et
  deploy-server:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 📥 Kodu İndir
        uses: actions/checkout@v4

      - name: 🚂 Railway Deploy (Opsiyonel)
        if: ${{ vars.RAILWAY_TOKEN != '' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          cd server
          railway up --detach
        continue-on-error: true
